name: Scan FB Marketplace (AU)

on:
  schedule:
    # Twice daily (~7:37am and ~6:37pm Sydney, AEDT). Sized to the Apify free plan:
    # 3 queries x 4 listings x 2 runs/day ~= 720 listings/month (~$4.5 at $0.0062 each).
    - cron: "37 20,7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fb-marketplace-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run CoffeeFlip AU scan
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run scan

      - name: Commit updated deals & seen state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/seen.json data/usage.json docs/data/deals.json docs/data/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update FB Marketplace deals"
            git push
          else
            echo "No new changes to commit."
          fi
